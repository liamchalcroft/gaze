name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync
    - name: Run pre-commit
      run: uv run pre-commit run --all-files --show-diff-on-failure

  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # macOS is the primary development platform; verify on it too.
          - os: macos-latest
            python-version: "3.14"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync
    - name: Run linting
      run: uv run ruff check .
    - name: Check formatting
      run: uv run ruff format --check .
    - name: Run type checking
      run: uv run pyright src/
    - name: Verify lockfile is in sync
      run: uv lock --check
    - name: Run tests
      run: uv run pytest tests/ --cov=gaze --cov-report=xml
    - name: Upload coverage to Codecov
      # Only one matrix leg uploads. Codecov requires a token (the CODECOV_TOKEN
      # repository secret) even for public repos; tokenless uploads are rejected.
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
    - name: Install dependencies with NOVA extras
      run: uv sync --extra nova
    - name: Run torch-gated core tests + example suites with full coverage
      # The nova extra provides torch/datasets, so the torch-gated tests in
      # tests/ (which the base check job skips) actually execute here, along
      # with every example's smoke tests. Coverage spans the core library, the
      # HuggingFace adapter, and the NOVA example package (none of which the
      # core check job measures).
      #
      # Deterministic order (-p no:randomly): the NOVA example tests import the
      # example package under two paths (src.* and examples.nova.src.*), so a
      # shuffled run can load it twice as distinct modules and trip beartype
      # class-identity checks. Order-dependence in the library is policed by the
      # randomised check jobs on tests/.
      run: |
        uv run pytest tests/ examples/ --ignore=examples/aiih2026_paper -p no:randomly \
          --cov=gaze --cov=examples/nova/src --cov-report=xml:coverage-full.xml --tb=short
    - name: Upload full coverage to Codecov
      # One matrix leg uploads to avoid duplicate integration coverage reports.
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage-full.xml
        flags: integration
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: surfaces dependency vulnerabilities without blocking merges.
    continue-on-error: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
    - name: Audit locked dependencies
      run: |
        uv export --frozen --no-emit-project --no-hashes --format requirements-txt > /tmp/requirements.txt
        uvx pip-audit --requirement /tmp/requirements.txt

  ci-success:
    # Single required status check for branch protection: succeeds only when
    # every required job above succeeded. The advisory `security` job is
    # intentionally excluded.
    if: always()
    needs: [pre-commit, check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Verify required jobs succeeded
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo "::error::One or more required CI jobs failed."
        exit 1
